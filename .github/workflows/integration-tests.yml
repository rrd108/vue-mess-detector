name: Integration Tests

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: yarn

      - name: Install dependencies
        run: yarn install

      - name: Build package
        run: yarn build

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: vue-mess-detector
          retention-days: 1
          path: |
            ./package.json
            ./dist
            ./node_modules
            ./yarn.lock
            ./index.d.ts

  test-create-vue:
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 15
    needs: build

    strategy:
      matrix:
        platform: [macos-latest, ubuntu-latest, windows-latest]
        package-manager: [npm, yarn, pnpm, bun]

    name: Testing Vue with ${{ matrix.package-manager }} on ${{ matrix.platform }}
    steps:
      - name: Create directories
        run: |
          mkdir ./package
          mkdir ./test-repo

      - name: Download artifact
        uses: actions/download-artifact@v8
        with:
          name: vue-mess-detector
          path: ./package

      - if: matrix.package-manager != 'bun'
        name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - if: matrix.package-manager == 'pnpm'
        name: Check PNPM
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - if: matrix.package-manager == 'yarn'
        name: Check Yarn
        run: |
          corepack prepare yarn@stable --activate
          yarn set version stable

      - if: matrix.package-manager == 'bun'
        name: Check Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Create and Run Vue Mess Detector
        shell: bash
        working-directory: ./test-repo
        run: |
          if [ "${{ matrix.package-manager }}" == "pnpm" ]; then
            echo "my-package" | pnpm create vue@latest . --default --typescript
            pnpm add file:../package/ -D
            pnpm install
            pnpm vue-mess-detector analyze --output=json --file-output=vmd-output.json
          elif [ "${{ matrix.package-manager }}" == "yarn" ]; then
            echo "my-package" | yarn --cwd . create vue . --default --typescript
            touch ./yarn.lock
            yarn add vue-mess-detector@file:../package/ -D
            yarn install
            yarn vue-mess-detector analyze --output=json --file-output=vmd-output.json
          elif [ "${{ matrix.package-manager }}" == "bun" ]; then
            echo "my-package" | bun create vue . --default --typescript
            bun add file:../package/ --dev
            bun install --ignore-scripts
            bun run vue-mess-detector analyze --output=json --file-output=vmd-output.json
          else
            echo "my-package" | npm create vue@latest -- . --default --typescript
            npm install file:../package/ --save-dev
            npm install
            npx vue-mess-detector analyze --output=json --file-output=vmd-output.json
          fi
          node -e "const fs = require('fs'); try { const data = JSON.parse(fs.readFileSync('vmd-output.json', 'utf8')); console.log(JSON.stringify(data, null, 2)); } catch (e) { throw new Error('Something went wrong'); }"

  test-nuxi:
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 15
    needs: build
    strategy:
      matrix:
        platform: [macos-latest, ubuntu-latest, windows-latest]
        package-manager: [npm, yarn, pnpm, bun]

    name: Testing Nuxt with ${{ matrix.package-manager }} on ${{ matrix.platform }}
    steps:
      - name: Create directories
        run: |
          mkdir ./package

      - name: Download artifact
        uses: actions/download-artifact@v8
        with:
          name: vue-mess-detector
          path: ./package

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - if: matrix.package-manager == 'pnpm'
        name: Check PNPM
        uses: pnpm/action-setup@v4
        with:
          version: latest

      - if: matrix.package-manager == 'yarn'
        name: Check Yarn
        run: |
          corepack prepare yarn@stable --activate
          yarn set version stable

      - if: matrix.package-manager == 'bun'
        name: Check Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Create and Run Vue Mess Detector
        shell: bash
        env:
          # pnpm 11+ fails when dependency build scripts (e.g. esbuild) are skipped
          PNPM_CONFIG_STRICT_DEP_BUILDS: 'false'
        run: |
          if [ "${{ matrix.package-manager }}" == "pnpm" ]; then
            pnpm dlx nuxi@latest init test-repo --package-manager pnpm --git-init -t content
            cd test-repo
            pnpm add file:../package/ -D
            pnpm install
            pnpm vue-mess-detector analyze ./ --output=json --file-output=vmd-output.json
          elif [ "${{ matrix.package-manager }}" == "yarn" ]; then
            yarn dlx nuxi@latest init test-repo --package-manager yarn --git-init -t content --no-install
            cd test-repo
            touch yarn.lock
            yarn add vue-mess-detector@file:../package/ -D
            yarn install
            yarn vue-mess-detector analyze ./ --output=json --file-output=vmd-output.json
          elif [ "${{ matrix.package-manager }}" == "bun" ]; then
            bun x nuxi@latest init test-repo --package-manager bun --git-init -t content
            cd test-repo
            bun add file:../package/ --dev
            bun install --ignore-scripts
            bun run vue-mess-detector analyze ./ --output=json --file-output=vmd-output.json
          else
            npx nuxi@latest init test-repo --package-manager npm --git-init -t content
            cd test-repo
            npm install file:../package/ --save-dev
            npm install
            npx vue-mess-detector analyze ./ --output=json --file-output=vmd-output.json
          fi
          node -e "const fs = require('fs'); try { const data = JSON.parse(fs.readFileSync('vmd-output.json', 'utf8')); console.log(JSON.stringify(data, null, 2)); } catch (e) { throw new Error('Something went wrong'); }"

name: Documentation Release

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
  workflow_dispatch: # Allows manual trigger

jobs:
  deploy-docs:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: yarn

      - name: Install dependencies
        run: yarn install

      - name: Check missing docs
        run: yarn docs:missing

      - name: Build documentation
        run: yarn docs:build

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Configure vmd_balarama SSH alias
        run: |
          mkdir -p ~/.ssh
          cat >> ~/.ssh/config <<EOF
          Host vmd_balarama
              HostName ${{ secrets.SSH_HOST }}
              User webmania_vmd
              StrictHostKeyChecking accept-new
          EOF
          chmod 600 ~/.ssh/config

      - name: Deploy to server
        run: |
          rsync --progress -azh \
            --delete --exclude='error/' --exclude='stats/' --exclude='.htaccess' --exclude='robots.txt' \
            ./docs/.vitepress/dist/ \
            vmd_balarama:./web/

      - name: Update release file
        run: |
          current_datetime=$(date "+%Y-%m-%d %H:%M:%S %Z")
          echo "Last release: $current_datetime" > ./docs/.release

      - name: Commit release file
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add docs/.release
          git commit -m "Update docs release timestamp [skip ci]" || echo "No changes to commit"
          git push

name: JSR Publish

on:
  release:
    types: [created]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish, for example v0.69.0
        required: true

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # The OIDC ID token is used for authentication with JSR.
    steps:
      - name: Checkout code at release tag
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag || github.ref }} # Use the tag that triggered the event

      - name: Get the release tag name
        id: get_tag
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          tag="${INPUT_TAG:-${GITHUB_REF#refs/tags/}}"
          echo "tag=$tag" >> $GITHUB_OUTPUT

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: yarn

      - name: Install dependencies
        run: yarn install

      - name: Set jsr.json version from the tag
        env:
          TAG: ${{ steps.get_tag.outputs.tag }}
        run: |
          jq --arg v "${TAG#v}" '.version = $v' jsr.json > tmp.json && mv tmp.json jsr.json
          jq -r .version jsr.json

      - name: Publish to JSR with version from tag
        run: npx jsr@0.13.5 publish --allow-dirty
